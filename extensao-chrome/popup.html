<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>pega-oferta</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 340px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #141311;
      color: #f5f4f1;
      padding: 16px;
    }
    .topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .marca {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.02em;
    }
    .ponto { color: #f95c1f; }
    .badge {
      font-family: ui-monospace, monospace;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid rgba(249, 92, 31, 0.4);
      background: rgba(249, 92, 31, 0.14);
      color: #fdba74;
    }
    .preview {
      display: flex;
      gap: 10px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #2b2925;
      background: #1c1b18;
      margin-bottom: 12px;
    }
    .preview img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
      background: #2b2925;
      flex-shrink: 0;
    }
    .preview-info { min-width: 0; flex: 1; }
    .preview-titulo {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .preview-preco {
      margin-top: 4px;
      font-family: ui-monospace, monospace;
      font-size: 13px;
      font-weight: 700;
      color: #4ade80;
    }
    label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9b978e;
      margin: 8px 0 4px;
      font-weight: 600;
    }
    input {
      width: 100%;
      background: #1c1b18;
      border: 1px solid #302e29;
      color: #f5f4f1;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      outline: none;
    }
    input:focus { border-color: #f95c1f; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    button {
      border: 0;
      border-radius: 9px;
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-sec {
      background: #25231f;
      color: #f5f4f1;
      border: 1px solid #35332d;
    }
    .btn-fogo {
      background: #f95c1f;
      color: #fff;
      box-shadow: 0 4px 14px rgba(249, 92, 31, 0.35);
    }
    .status {
      margin-top: 10px;
      font-size: 11px;
      color: #9b978e;
      min-height: 16px;
    }
    .status.ok { color: #4ade80; }
    .status.err { color: #f87171; }
  </style>
</head>
<body>
  <div class="topo">
    <div class="marca">pega-oferta<span class="ponto">.</span></div>
    <span class="badge">EXTENSAO v1.0</span>
  </div>

  <div class="preview">
    <img id="foto" alt="" />
    <div class="preview-info">
      <div id="tituloPreview" class="preview-titulo">Lendo pagina da loja...</div>
      <div id="precoPreview" class="preview-preco">R$ --</div>
    </div>
  </div>

  <label>Servidor pega-oferta</label>
  <input id="servidor" value="http://localhost:3000" />

  <label>Titulo da oferta</label>
  <input id="titulo" placeholder="Nome do produto" />

  <div class="grid2">
    <div>
      <label>Preco (R$)</label>
      <input id="preco" placeholder="249,90" />
    </div>
    <div>
      <label>Cupom (opcional)</label>
      <input id="cupom" placeholder="EX: TECH10" />
    </div>
  </div>

  <div class="acoes">
    <button id="btnSalvar" class="btn-sec">Salvar no catalogo</button>
    <button id="btnDisparar" class="btn-fogo">Salvar e Disparar</button>
  </div>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
